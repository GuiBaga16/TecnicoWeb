<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Refrigerantes</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 800px;
                margin: 32px auto;
                padding: 0 16px;
            }
            h1 {
                margin-bottom: 24px;
            }
            label {
                display: inline-block;
                margin: 4px 0 2px;
                font-size: 0.85rem;
            }
            input {
                display: block;
                padding: 6px 10px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                width: 100%;
            }
            button {
                padding: 7px 16px;
                margin-right: 6px;
                cursor: pointer;
                border: 1px solid #999;
                border-radius: 4px;
                background: #f5f5f5;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 32px;
            }
            th,
            td {
                padding: 9px 12px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }
            th {
                background: #f5f5f5;
            }
        </style>
    </head>
    <body>
        <h1>Refrigerantes</h1>

        <p>Consumindo: <code>http://localhost:8080</code></p>

        <form
            onsubmit="salvar(event)"
            style="max-width: 400px; margin-top: 16px"
        >
            <input type="hidden" id="editandoId" />
            <label>Nome</label>
            <input id="nome" placeholder="Ex: Coca-Cola" required />
            <label>sabor</label>
            <input id="sabor" placeholder="Ex: coca" required />
            <label>Cor</label>
            <input id="cor" placeholder="Ex: Vermelho" required />
            <label>Quantidade</label>
            <input id="quantidade" placeholder="Ex: 2.5L" required />
            <button type="submit">Salvar</button>
            <button
                type="button"
                id="btnCancelar"
                style="display: none"
                onclick="
                    document.getElementById('editandoId').value = '';
                    document.getElementById('btnCancelar').style.display = 'none';
                    this.form.reset();
                "
            >
                Cancelar
            </button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>sabor</th>
                    <th>Cor</th>
                    <th>Quantidade</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>

        <script>
            // Endereço base da API.
            const API = "https://6a28acb24e1e783349a5dfdf.mockapi.io/api/refri";

            // GET /refrigerantes — busca todos os refrigerantes e monta a tabela
            async function carregar() {
                const resp = await fetch(`${API}/Refri`); // requisição GET
                const refrigerantes = await resp.json();          // converte o JSON em array de objetos

                let html = "";
                for (const r of refrigerantes) {
                    html += `
        <tr>
          <td>${r.id}</td>
          <td>${r.nome}</td>
          <td>${r.sabor}</td>
          <td>${r.cor}</td>
          <td>${r.quantidade}</td>
          <td>
            <button onclick="editar(${r.id})">Editar</button>
            <button onclick="deletar(${r.id})">Excluir</button>
          </td>
        </tr>`;
                }
                document.getElementById("lista").innerHTML = html;
            }

            // POST /refrigerantes ou PUT /refrigerantes/:id — cria ou atualiza dependendo se há id preenchido
            async function salvar(event) {
                event.preventDefault();

                const id = document.getElementById("editandoId").value;

                // Monta o objeto com os dados do formulário
                const dados = {
                    nome: document.getElementById("nome").value,
                    sabor: document.getElementById("sabor").value,
                    cor: document.getElementById("cor").value,
                    quantidade: document.getElementById("quantidade").value,
                };

                if (id) {
                    // PUT /refrigerantes/:id — atualiza o refrigerante existente; body com os novos dados em JSON
                    await fetch(`${API}/refrigerantes/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dados),
                    });
                } else {
                    // POST /refrigerantes — cria um novo refrigerante; body com os dados em JSON
                    await fetch(`${API}/refrigerantes`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dados),
                    });
                }

                document.getElementById("editandoId").value = "";
                document.getElementById("btnCancelar").style.display = "none";
                event.target.reset();
                carregar(); // atualiza a tabela após salvar
            }

            // GET /refrigerantes/:id — busca um refrigerante pelo id e preenche o formulário para edição
            async function editar(id) {
                const resp = await fetch(`${API}/refrigerantes/${id}`); // requisição GET com o id na URL
                const refrigerante = await resp.json();                 // objeto com os dados do refrigerante

                // Preenche os campos do formulário com os dados recebidos da API
                document.getElementById("editandoId").value = refrigerante.id;
                document.getElementById("nome").value = refrigerante.nome;
                document.getElementById("sabor").value = refrigerante.sabor;
                document.getElementById("cor").value = refrigerante.cor;
                document.getElementById("quantidade").value = refrigerante.quantidade;
                document.getElementById("btnCancelar").style.display = "inline";
            }

            // DELETE /refrigerantes/:id — remove o refrigerante pelo id
            async function deletar(id) {
                if (!confirm("Excluir este refrigerante?")) return;
                await fetch(`${API}/refrigerantes/${id}`, { method: "DELETE" }); // sem body, só o método e o id na URL
                carregar(); // atualiza a tabela após excluir
            }

            carregar(); // carrega a lista ao abrir a página
        </script>
    </body>
</html>
